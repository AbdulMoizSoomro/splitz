# ============================================
# ACTIVE PROFILE
# ============================================
# Use 'dev' for local development with H2
# Use 'prod' for production with PostgreSQL
spring.profiles.active=dev

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080

# ============================================
# JWT CONFIGURATION
# ============================================
# ⚠️ SECURITY WARNING: Externalize these in production!
# Use environment variables: JWT_SECRET and JWT_EXPIRATION
jwt.secret=${JWT_SECRET:c2RqZmhzZGZoc2Rma3NkZmtzZGZrc2Rma3Nka3Nka3Nka3Nka3Nka3Nka3Nka3Nka3Nka3Nka3Nka3Nk}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# ACTUATOR CONFIGURATION
# ============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# SECURITY CONFIGURATION
# ============================================
# CORS allowed origins (comma-separated list)
app.security.cors.allowed-origins=http://localhost

# ============================================
# FLYWAY CONFIGURATION
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

