# Continuous Integration Workflow for SPLITZ
# Runs on every push to main and pull requests targeting main
# Validates build and runs all tests

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs of the same workflow on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle and Spotless
        run: mvn -B validate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and package
        run: mvn -B clean package -DskipTests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            **/target/*.jar
            **/target/classes/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with coverage
        run: mvn -B verify -Dsurefire.useFile=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            **/target/site/jacoco/
          retention-days: 7

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f user-service/target/site/jacoco/index.html ]; then
            # Extract coverage percentage from JaCoCo report
            COVERAGE=$(grep -oP 'Total.*?(\d+)%' user-service/target/site/jacoco/index.html | grep -oP '\d+%' | head -1 || echo "N/A")
            echo "**User Service Line Coverage:** $COVERAGE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Detailed report available in the coverage-report artifact." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report not found." >> $GITHUB_STEP_SUMMARY
          fi

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-user
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-user
        run: npx playwright install --with-deps chromium

      # The suite drives three real containers (postgres, rabbitmq, two Spring services) and a Vite
      # dev server, exercising the genuine RabbitMQ-mediated friendship round trip. H2 is not enough:
      # these tests depend on cross-service event delivery.
      #
      # Started in two phases rather than one `up`: both Spring services run `mvn spring-boot:run` at
      # container start, so bringing them up together against one shared Maven repository races.
      # Each now has its own cache volume, and the phase split keeps the ordering explicit.
      - name: Start databases and broker
        run: docker compose up -d db rabbitmq

      - name: Start application services
        run: docker compose up -d user-service expense-service frontend-user

      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            u=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            e=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/actuator/health || true)
            f=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/ || true)
            echo "attempt $i: user=$u expense=$e frontend=$f"
            if [ "$u" = "200" ] && [ "$e" = "200" ] && [ "$f" = "200" ]; then
              echo "Stack is ready"
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not become ready in time" >&2
          docker compose logs --tail 100 >&2
          exit 1

      - name: Run Playwright suite
        working-directory: frontend-user
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-user/playwright-report/
            frontend-user/test-results/
          retention-days: 7

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
